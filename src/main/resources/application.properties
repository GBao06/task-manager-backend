# ===== Ket noi MySQL =====
# Doi lai username/password theo may cua ban (XAMPP/MySQL Installer mac dinh
# thuong la username=root, password=rong hoac password ban dat luc cai)
spring.datasource.url=jdbc:mysql://localhost:3308/taskmanager_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update: tu dong tao/cap nhat bang theo Entity (tien loi khi dang code)
# Khi bao ve/nop bai nen doi thanh "validate" va quan ly migration rieng neu co thoi gian
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# Chuoi secret duoc encode base64, dung de ky token - khi trien khai that nen doi chuoi khac
jwt.secret=NDI0YTY5NmMyMDZiNjU3OTIwNjM2ODZmMjA2ODY1NzQyMDZlNjE2ZTIwNzM2ODY5NmU2NyEyMDIxMjA=
jwt.expiration-ms=86400000

# ===== Server =====
server.port=8080
